# i3status-rust — ~/.config/i3status-rust/config.toml

[theme]
theme = "gruvbox-dark"

[icons]
icons = "material-nf"

[[block]]
block = "disk_space"
path = "/"
info_type = "used"
format = " $icon / $used/$total ($percentage) "
interval = 60
warning = 80.0
alert = 90.0

[[block]]
block = "disk_space"
path = "/home"
info_type = "used"
format = " $icon / $used/$total ($percentage) "
interval = 60
warning = 80.0
alert = 90.0

[[block]]
block = "net"
format = " $icon ^icon_net_down $speed_down.eng(prefix:K) ^icon_net_up $speed_up.eng(prefix:K) "
interval = 2

[[block]]
block = "memory"
format = " $icon $mem_used.eng(prefix:Mi)/$mem_total.eng(prefix:Mi) "
interval = 5

[[block]]
block = "cpu"
format = " $icon $utilization $frequency"
interval = 2

[[block]]
block = "temperature"
format = " $icon $max "
chip = "coretemp-*"
interval = 5

[[block]]
block = "load"
format = " $icon $1m.eng(w:4) "
interval = 5

[[block]]
block = "battery"
device = "BAT0"
format = " $icon $percentage ↓ {$time |}"
charging_format = " $icon $percentage ⚡ {$time |}"
full_format = " $icon $percentage ✓ "
not_charging_format = " $icon $percentage ⏸ "
interval = 10
full_threshold=99
[[block.click]]
button = "left"
cmd = "~/bin/batmode"
update = true

[[block]]
block = "backlight"

[[block]]
block = "toggle"
format = " $icon "
state_on = "info"
icon_on = "weather_moon"
icon_off = "weather_sun"
command_state = "pgrep -x gammastep >/dev/null && echo on"
command_on = "setsid -f gammastep >/dev/null 2>&1; sleep 0.3"
command_off = "pkill -x gammastep"
interval = 5

[[block]]
block = "sound"
[[block.click]]
button = "left"
action = "toggle_mute"

[[block]]
block = "sound"
device_kind = "source"
[[block.click]]
button = "left"
action = "toggle_mute"

[[block]]
block = "privacy"
[[block.driver]]
name = "v4l"
[[block.driver]]
name = "pipewire"

[[block]]
block = "notify"
driver = "dunst"

# "Caffeine": click to keep the screen from blanking/locking
[[block]]
block = "toggle"
format = " $icon "
command_state = "xset q | grep -q 'DPMS is Disabled' && echo on"
command_on = "xset s off -dpms"
command_off = "xset s on +dpms"
interval = 10

[[block]]
block = "weather"
format = " $icon $temp "
autolocate = true
autolocate_interval = "once"
interval = 900
[block.service]
name = "nws"
units = "imperial"

[[block]]
block = "packages"
package_manager = ["pacman", "aur"]
aur_command = "yay -Qua"
interval = 1800
format = " $icon $pacman+$aur "
format_up_to_date = ""
warning_updates_regex = "^linux "

[[block]]
block = "custom"
json = true
format = " ^icon_update $text "
command = '''n=$(pacdiff -o | wc -l); if [ "$n" -gt 0 ]; then printf '{"text":"pacnew %s","state":"Critical"}\n' "$n"; else echo '{"text":""}'; fi'''
interval = 3600
hide_when_empty = true
[[block.click]]
button = "left"
cmd = "alacritty -e sh -c \"sudo DIFFPROG='vim -d' pacdiff; i3status-rs-refresh 2>/dev/null; read -p 'Done, press Enter'\""

[[block]]
block = "time"
format = " $icon $timestamp.datetime(f:'%d/%b/%g %H:%M') "
interval = 10
