# i3 additions for sparky (Dell XPS 15 7590). Included at the end of the
# shared config, so $mod and $term are already set. Only add here; anything
# both hosts need goes in the shared config.

# Rearrange displays/workspaces whenever a screen appears or vanishes (dock)
exec_always --no-startup-id ~/bin/desk-watch.sh

# Razer Cobra Pro: solid colour instead of the rainbow (its static mode ignores colours)
exec --no-startup-id openrgb --device "Razer Cobra Pro" --mode direct --color 0000FF --brightness 50
