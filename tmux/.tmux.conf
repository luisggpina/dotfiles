set -gw mode-keys vi

# Vim users: no Esc delay
set -s escape-time 10

# True color in Alacritty
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"

# Let Vim see focus changes
set -g focus-events on

# More scrollback
set -g history-limit 50000

# Window numbers match the keyboard; no gaps
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open splits and new windows in the current pane's directory
bind c   new-window      -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vi copy mode, yanking to the X clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

bind p paste-buffer
bind P run "xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer"

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

# Allow middle click to work as expected
bind -n MouseDown2Pane run "xclip -o -selection primary | tmux load-buffer - && tmux paste-buffer -p"

# Per-host additions, if any
source-file -q ~/.tmux.local.conf
